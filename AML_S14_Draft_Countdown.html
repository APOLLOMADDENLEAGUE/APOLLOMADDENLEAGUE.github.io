<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020303" />
  <title>AML Season 14</title>
  <style>
    :root {
      --text: #f5f7f6;
      --muted: rgba(245,247,246,.64);
      --line: rgba(255,255,255,.12);
      --green: #77a68a;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: #020303; }
    body { margin: 0; background: #020303; color: var(--text); font-family: Arial, Helvetica, sans-serif; }

    .aml-opening {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 55% 35%, rgba(99, 151, 117, .22), transparent 24%),
        radial-gradient(circle at 52% 65%, rgba(69, 118, 84, .14), transparent 33%),
        linear-gradient(180deg, #050807 0%, #06100b 44%, #020403 100%);
    }

    .aml-opening::before {
      content: "";
      position: absolute;
      inset: -8%;
      z-index: -3;
      opacity: .62;
      background:
        linear-gradient(112deg, transparent 0 35%, rgba(122, 178, 142, .10) 36% 38%, transparent 39% 52%, rgba(150, 198, 164, .08) 53% 55%, transparent 56%),
        linear-gradient(76deg, transparent 0 44%, rgba(255,255,255,.035) 45% 46%, transparent 47%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 84px);
      transform: rotate(-3deg) scale(1.08);
      filter: blur(.2px);
    }

    .aml-opening::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.17), rgba(0,0,0,.05) 32%, rgba(0,0,0,.18) 72%, rgba(0,0,0,.74)),
        radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.62) 100%);
    }

    .noise {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .085;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.48'/%3E%3C/svg%3E");
    }

    .opening-brand {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      font-weight: 900;
      font-size: 17px;
      letter-spacing: .22em;
    }

    .countdown-wrap {
      width: min(1060px, calc(100% - 36px));
      text-align: center;
      padding: 86px 0 70px;
    }

    .countdown-title {
      margin: 0;
      font-size: clamp(19px, 3vw, 32px);
      font-weight: 900;
      letter-spacing: .16em;
      line-height: 1.3;
      text-transform: uppercase;
      text-shadow: 0 3px 24px rgba(0,0,0,.5);
    }

    .countdown-subtitle {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: clamp(13px, 1.8vw, 19px);
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(9, auto);
      align-items: start;
      justify-content: center;
      gap: clamp(9px, 2.2vw, 29px);
      margin-top: clamp(42px, 8vw, 76px);
    }

    .unit { min-width: clamp(54px, 9vw, 112px); }
    .value {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: clamp(37px, 7vw, 72px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: .02em;
      text-shadow: 0 5px 22px rgba(0,0,0,.6);
    }
    .label {
      display: block;
      margin-top: 18px;
      color: rgba(245,247,246,.62);
      font-size: clamp(10px, 1.5vw, 15px);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .colon {
      margin-top: clamp(2px, 1vw, 7px);
      color: rgba(245,247,246,.58);
      font-size: clamp(32px, 6vw, 61px);
      line-height: .95;
      font-weight: 700;
    }

    .scroll-cue {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      background: rgba(255,255,255,.035);
      color: rgba(255,255,255,.75);
      text-decoration: none;
      font-size: 24px;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .demo-below {
      min-height: 50vh;
      display: grid;
      place-items: center;
      padding: 80px 20px;
      color: #999;
      background: #08090c;
      text-align: center;
    }

    @media (max-width: 650px) {
      .opening-brand { font-size: 15px; letter-spacing: .17em; }
      .countdown-wrap { width: calc(100% - 24px); }
      .countdown-title { font-size: clamp(18px, 5.6vw, 26px); letter-spacing: .11em; }
      .countdown-subtitle { margin-top: 13px; font-size: 12px; letter-spacing: .22em; }
      .timer { gap: 4px; margin-top: 52px; }
      .unit { min-width: 50px; }
      .value { font-size: clamp(34px, 10vw, 48px); }
      .label { margin-top: 14px; font-size: 9px; letter-spacing: .09em; }
      .colon { font-size: 33px; margin-top: 2px; }
    }

    @media (max-width: 390px) {
      .timer { gap: 2px; }
      .unit { min-width: 45px; }
      .value { font-size: 33px; }
      .colon { font-size: 28px; }
      .label { font-size: 8px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .countdown-wrap { animation: reveal .9s ease both; }
      .scroll-cue { animation: float 2.3s ease-in-out infinite; }
      @keyframes reveal { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes float { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,6px); } }
    }
  </style>
</head>
<body>
  <section class="aml-opening" id="aml-opening" aria-labelledby="countdownHeading">
    <div class="noise" aria-hidden="true"></div>
    <div class="opening-brand">AML</div>

    <div class="countdown-wrap">
      <h1 class="countdown-title" id="countdownHeading">AML SEASON 14 DRAFT DAY COUNTDOWN</h1>
      <p class="countdown-subtitle" id="countdownSubtitle">A BRAND NEW YEAR IS COMING</p>

      <div class="timer" role="timer" aria-live="off" aria-label="Time remaining until the AML Season 14 draft">
        <div class="unit"><span class="value" id="months">00</span><span class="label">Months</span></div>
        <div class="colon" aria-hidden="true">:</div>
        <div class="unit"><span class="value" id="days">00</span><span class="label">Days</span></div>
        <div class="colon" aria-hidden="true">:</div>
        <div class="unit"><span class="value" id="hours">00</span><span class="label">Hours</span></div>
        <div class="colon" aria-hidden="true">:</div>
        <div class="unit"><span class="value" id="minutes">00</span><span class="label">Min</span></div>
        <div class="colon" aria-hidden="true">:</div>
        <div class="unit"><span class="value" id="seconds">00</span><span class="label">Sec</span></div>
      </div>
    </div>

    <a class="scroll-cue" href="#site-content" aria-label="Continue to AML website">⌄</a>
  </section>

  <main class="demo-below" id="site-content">
    <div>This area represents the current AML homepage content. When merged into the real site, your existing homepage starts here.</div>
  </main>

  <script>
    (() => {
      // September 5, 2026 at 8:30 PM Eastern Daylight Time (UTC-4).
      const target = new Date('2026-09-05T20:30:00-04:00').getTime();
      const $ = id => document.getElementById(id);
      const els = {
        months: $('months'), days: $('days'), hours: $('hours'),
        minutes: $('minutes'), seconds: $('seconds'),
        subtitle: $('countdownSubtitle')
      };
      const pad = n => String(Math.max(0, n)).padStart(2, '0');

      function updateCountdown() {
        const now = Date.now();
        let diff = target - now;

        if (diff <= 0) {
          els.months.textContent = '00';
          els.days.textContent = '00';
          els.hours.textContent = '00';
          els.minutes.textContent = '00';
          els.seconds.textContent = '00';
          els.subtitle.textContent = 'SEASON 14 IS HERE';
          return;
        }

        // The launch is less than a month away, so the opening deliberately mirrors
        // the Doomsday-style MONTHS : DAYS : HOURS : MIN : SEC layout with months at 00.
        const months = 0;
        const days = Math.floor(diff / 86400000);
        diff %= 86400000;
        const hours = Math.floor(diff / 3600000);
        diff %= 3600000;
        const minutes = Math.floor(diff / 60000);
        diff %= 60000;
        const seconds = Math.floor(diff / 1000);

        els.months.textContent = pad(months);
        els.days.textContent = pad(days);
        els.hours.textContent = pad(hours);
        els.minutes.textContent = pad(minutes);
        els.seconds.textContent = pad(seconds);
      }

      updateCountdown();
      setInterval(updateCountdown, 250);
    })();
  </script>
</body>
</html>
