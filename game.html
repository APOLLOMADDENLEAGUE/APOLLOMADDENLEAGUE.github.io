<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" /><meta name="theme-color" content="#050507" />
  <title>AML Box Score | Apollo Madden League</title><link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="premium.css?v=28" />
  <style>.data-shell{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:34px 0 70px}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px;padding:28px;margin-top:24px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(255,255,255,.035)}.score-team:last-child{text-align:right}.team-link{color:#fff;text-decoration:none}.team-link:hover,.team-link:focus-visible{color:#ff63b7}.team-link h1{font-size:clamp(1.8rem,5vw,3.4rem);margin:5px 0}.user{color:#9fa4b3;font-weight:800}.final-score{font-size:clamp(2.4rem,8vw,5rem);font-weight:950;white-space:nowrap;text-align:center}.final-label{display:block;font-size:.72rem;color:#ff63b7;letter-spacing:.12em}.section-heading{margin:34px 0 14px;font-size:1.7rem}.comparison{display:grid;gap:1px;border:1px solid rgba(255,255,255,.09);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.08)}.comparison-row{display:grid;grid-template-columns:1fr 1.3fr 1fr;text-align:center;background:#0d0e13;padding:12px}.comparison-row span:first-child{text-align:left}.comparison-row span:last-child{text-align:right}.comparison-label{color:#9fa4b3;font-size:.78rem;font-weight:850}.category{margin-top:28px}.category h3{letter-spacing:.08em}.team-tables{display:grid;grid-template-columns:1fr 1fr;gap:14px}.team-table{overflow:auto;border:1px solid rgba(255,255,255,.09);border-radius:16px}.team-table h4{position:sticky;left:0;margin:0;padding:14px;background:rgba(255,255,255,.045)}table{width:100%;border-collapse:collapse;min-width:430px}th,td{text-align:left;padding:10px 12px;border-top:1px solid rgba(255,255,255,.07);white-space:nowrap}th{color:#9fa4b3;font-size:.7rem;letter-spacing:.06em}.player-link{color:#fff;font-weight:850;text-decoration:none}.player-link:hover,.player-link:focus-visible{color:#ff63b7}.status{margin-top:22px;color:#9fa4b3}.empty{padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:16px}@media(max-width:760px){.scoreboard{gap:10px;padding:18px}.team-tables{grid-template-columns:1fr}.team-link h1{font-size:1.35rem}.user{font-size:.75rem}}</style>
</head>
<body class="aml-page"><main class="data-shell"><div class="topbar"><img class="mini-logo" src="assets/aml-logo.png" alt="AML logo" /><a class="home-link" href="schedule.html">← SCORES</a></div><div id="root"><p class="status">Loading box score…</p></div></main><script src="aml-live.js?v=6"></script><script>
(async()=>{
  const live=window.AML_LIVE,root=document.getElementById('root'),id=Number(new URLSearchParams(location.search).get('scheduleId')||0);
  if(!id){root.innerHTML='<div class="empty">No game selected.</div>';return;}
  const configs={passing:[['fullName','PLAYER'],['passComp','COMP'],['passAtt','ATT'],['passYds','YDS'],['passTDs','TD'],['passInts','INT'],['passerRating','QBR']],rushing:[['fullName','PLAYER'],['rushAtt','ATT'],['rushYds','YDS'],['rushYdsPerAtt','AVG'],['rushTDs','TD'],['rushFum','FUM']],receiving:[['fullName','PLAYER'],['recCatches','REC'],['recYds','YDS'],['recYdsPerCatch','AVG'],['recTDs','TD'],['recDrops','DROP']],defense:[['fullName','PLAYER'],['defTotalTackles','TKL'],['defSacks','SACK'],['defInts','INT'],['defTDs','TD'],['defDeflections','PD'],['defForcedFum','FF']],kicking:[['fullName','PLAYER'],['fGMade','FGM'],['fGAtt','FGA'],['fGLongest','LONG'],['xPMade','XPM'],['kickPts','PTS']],punting:[['fullName','PLAYER'],['puntAtt','PUNTS'],['puntYds','YDS'],['puntYdsPerAtt','AVG'],['puntLongest','LONG'],['puntsIn20','IN 20']]};
  const teamMetrics=[['POINTS','offPtsPerGame'],['TOTAL YARDS','offTotalYds'],['PASS YARDS','offPassYds'],['RUSH YARDS','offRushYds'],['FIRST DOWNS','off1stDowns'],['TURNOVERS','tOGiveaways'],['TAKEAWAYS','tOTakeaways'],['SACKS','defSacks'],['PENALTIES','penalties'],['PENALTY YARDS','penaltyYds'],['3RD DOWN','off3rdDownConvPct'],['4TH DOWN','off4thDownConvPct'],['RED ZONE','offRedZonePct']];
  try{
    const data=await live.api(`/game/${id}`),game=data.game,teams=data.teams||[],stats=data.stats||[];
    const away=teams.find(t=>Number(t.team_id)===Number(game.away_team_id))||{team_id:game.away_team_id,display_name:'Away Team'};
    const home=teams.find(t=>Number(t.team_id)===Number(game.home_team_id))||{team_id:game.home_team_id,display_name:'Home Team'};
    const name=t=>live.cleanTeamName(t.display_name||t.nick_name||t.abbr_name);
    const teamRow=teamId=>stats.find(row=>row.category==='team'&&Number(row.stats.teamId)===Number(teamId))?.stats||{};
    const awayTeamStats=teamRow(away.team_id),homeTeamStats=teamRow(home.team_id);
    const format=(value,key)=>{if(value===null||value===undefined)return '—';if(key.endsWith('Pct'))return `${Number(value).toFixed(1)}%`;return typeof value==='number'&&!Number.isInteger(value)?Number(value.toFixed(1)):value;};
    const playerTable=(category,team)=>{const rows=stats.filter(row=>row.category===category&&Number(row.stats.teamId)===Number(team.team_id)).map(row=>row.stats);const columns=configs[category];return `<div class="team-table"><h4><a class="team-link" href="${live.teamUrl(team.team_id)}">${live.esc(name(team))}</a></h4>${rows.length?`<table><thead><tr>${columns.map(([,label])=>`<th>${live.esc(label)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(([key])=>`<td>${key==='fullName'&&row.rosterId?`<a class="player-link" href="${live.playerUrl(row.rosterId)}">${live.esc(row[key]??'—')}</a>`:live.esc(format(row[key],key))}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">No stats</div>'}</div>`;};
    const categories=Object.keys(configs).filter(category=>stats.some(row=>row.category===category));
    document.title=`${name(away)} vs ${name(home)} | AML Box Score`;
    root.innerHTML=`<section class="scoreboard"><div class="score-team"><span class="eyebrow">AWAY</span><a class="team-link" href="${live.teamUrl(away.team_id)}"><h1>${live.esc(name(away))}</h1></a><div class="user">${live.esc(live.userName(away.team_id,away.user_name||''))}</div></div><div class="final-score"><span class="final-label">FINAL • ${live.weekLabel(game.week_index)}</span>${live.esc(game.away_score)} – ${live.esc(game.home_score)}</div><div class="score-team"><span class="eyebrow">HOME</span><a class="team-link" href="${live.teamUrl(home.team_id)}"><h1>${live.esc(name(home))}</h1></a><div class="user">${live.esc(live.userName(home.team_id,home.user_name||''))}</div></div></section><h2 class="section-heading">TEAM COMPARISON</h2><section class="comparison">${teamMetrics.map(([label,key])=>`<div class="comparison-row"><span>${live.esc(format(awayTeamStats[key],key))}</span><span class="comparison-label">${live.esc(label)}</span><span>${live.esc(format(homeTeamStats[key],key))}</span></div>`).join('')}</section>${categories.map(category=>`<section class="category"><h2 class="section-heading">${live.esc(category.toUpperCase())}</h2><div class="team-tables">${playerTable(category,away)}${playerTable(category,home)}</div></section>`).join('')}`;
  }catch(error){console.error('AML box score:',error);root.innerHTML='<div class="empty">Could not load this game’s stats.</div>';}
})();
</script></body></html>
