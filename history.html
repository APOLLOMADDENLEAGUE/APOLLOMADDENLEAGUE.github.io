<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AML HISTORY | Apollo Madden League</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .placeholder {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
    }
    .placeholder-inner {
      max-width: 760px;
    }
    .placeholder img {
      width: min(240px, 70vw);
      margin-bottom: 10px;
    }
    .placeholder h1 {
      font-size: clamp(2.4rem, 8vw, 5rem);
      margin: 12px 0;
    }
    .placeholder p {
      color: #a7a8b2;
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .back {
      display: inline-block;
      margin-top: 22px;
      color: white;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main class="placeholder">
    <div class="placeholder-inner">
      <img src="assets/aml-logo.png" alt="AML logo" />
      <h1>AML HISTORY</h1>
      <p>This section will hold AML seasons, champions, awards, records, Bowl history and the full league archive.</p>
      <a class="back" href="index.html">← BACK TO HOME</a>
    </div>
  </main>
</body>
</html>
