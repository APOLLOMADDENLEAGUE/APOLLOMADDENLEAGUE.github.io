<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#050507" />
  <title>AML Player | Apollo Madden League</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="premium.css?v=18" />
  <style>
    .data-shell{width:min(1050px,calc(100% - 24px));margin:0 auto;padding:34px 0 70px}.player-hero{padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(255,255,255,.035);margin-top:24px}.player-hero h1{font-size:clamp(2.8rem,7vw,5.5rem);line-height:.92;margin:8px 0}.player-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:#aeb4c5;font-weight:800}.player-team{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35)}.player-team:hover,.player-team:focus-visible{color:#ff63b7;border-color:#ff63b7}.ovr-big{font-size:4rem;font-weight:950}.section-heading{margin:34px 0 14px}.section-heading span{display:block;color:#ff63b7;font-size:.76rem;font-weight:900;letter-spacing:.12em}.section-heading h2{margin:4px 0 0;font-size:clamp(1.7rem,4vw,2.5rem)}.stat-groups{display:grid;gap:14px}.stat-group{padding:20px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:rgba(255,255,255,.03)}.stat-group h3{margin:0 0 14px;font-size:1rem;letter-spacing:.08em}.season-grid,.rating-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.season-stat,.rating{padding:16px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:rgba(255,255,255,.03)}.season-stat span,.rating span{display:block;color:#989eaf;font-size:.72rem;font-weight:800;letter-spacing:.08em}.season-stat strong,.rating strong{display:block;font-size:1.5rem;margin-top:5px}.status{margin-top:22px;color:#9fa4b3}.empty-stats{padding:20px;border:1px solid rgba(255,255,255,.09);border-radius:16px;color:#aeb4c5}@media(max-width:700px){.season-grid,.rating-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-hero{padding:20px}}
  </style>
</head>
<body class="aml-page">
  <main class="data-shell">
    <div class="topbar"><img class="mini-logo" src="assets/aml-logo.png" alt="AML logo" /><a class="home-link" href="stats.html">← WEEKLY STATS</a></div>
    <div id="root"><p class="status">Loading player profile…</p></div>
  </main>
  <script src="aml-live.js?v=4"></script>
  <script>
    (async()=>{
      const live=window.AML_LIVE;
      const root=document.getElementById('root');
      const id=Number(new URLSearchParams(location.search).get('rosterId')||0);
      if(!id){root.innerHTML='<p class="status">No player selected.</p>';return;}
      try{
        const [playerData,statsData,teamsData]=await Promise.all([live.api(`/player/${id}`),live.api(`/player-stats/${id}`),live.api('/teams')]);
        const p=playerData.player;
        const team=(teamsData.teams||[]).find(item=>Number(item.team_id)===Number(p.team_id));
        const rows=statsData.stats||[];
        const ratings=[['Speed',p.speed_rating],['Acceleration',p.accel_rating],['Agility',p.agility_rating],['Awareness',p.aware_rating],['Strength',p.strength_rating],['Stamina',p.stamina_rating],['Throw Power',p.throw_power_rating],['Short Accuracy',p.throw_acc_short_rating],['Mid Accuracy',p.throw_acc_mid_rating],['Deep Accuracy',p.throw_acc_deep_rating],['Catch',p.catch_rating],['Carry',p.carry_rating],['Short Route',p.route_run_short_rating],['Medium Route',p.route_run_med_rating],['Deep Route',p.route_run_deep_rating],['Tackle',p.tackle_rating],['Hit Power',p.hit_power_rating],['Man Coverage',p.man_cover_rating],['Zone Coverage',p.zone_cover_rating],['Press',p.press_rating],['Block Shed',p.block_shed_rating],['Finesse Moves',p.finesse_moves_rating],['Power Moves',p.power_moves_rating],['Kick Power',p.kick_power_rating],['Kick Accuracy',p.kick_acc_rating]].filter(item=>item[1]!==null&&item[1]!==undefined);
        const definitions={
          passing:[['COMP','passComp','sum'],['ATT','passAtt','sum'],['YDS','passYds','sum'],['TD','passTDs','sum'],['INT','passInts','sum'],['COMP %','passCompPct','avg'],['QBR','passerRating','avg']],
          rushing:[['ATT','rushAtt','sum'],['YDS','rushYds','sum'],['AVG','rushYdsPerAtt','ratio','rushYds','rushAtt'],['TD','rushTDs','sum'],['FUM','rushFum','sum']],
          receiving:[['REC','recCatches','sum'],['YDS','recYds','sum'],['AVG','recYdsPerCatch','ratio','recYds','recCatches'],['TD','recTDs','sum'],['DROPS','recDrops','sum']],
          defense:[['TKL','defTotalTackles','sum'],['SACK','defSacks','sum'],['INT','defInts','sum'],['PD','defDeflections','sum'],['FF','defForcedFum','sum'],['FR','defFumRec','sum']],
          kicking:[['FGM','fGMade','sum'],['FGA','fGAtt','sum'],['LONG','fGLongest','max'],['XPM','xPMade','sum'],['XPA','xPAtt','sum'],['PTS','kickPts','sum']],
          punting:[['PUNTS','puntAtt','sum'],['YDS','puntYds','sum'],['AVG','puntYdsPerAtt','ratio','puntYds','puntAtt'],['LONG','puntLongest','max'],['IN 20','puntsIn20','sum'],['TB','puntTBs','sum']]
        };
        const sum=(items,key)=>items.reduce((total,row)=>total+(Number(row.stats[key])||0),0);
        const calculate=(items,definition)=>{
          const [,key,method,numerator,denominator]=definition;
          if(method==='sum')return sum(items,key);
          if(method==='max')return Math.max(0,...items.map(row=>Number(row.stats[key])||0));
          if(method==='ratio'){const bottom=sum(items,denominator);return bottom?Number((sum(items,numerator)/bottom).toFixed(1)):0;}
          const values=items.map(row=>Number(row.stats[key])).filter(Number.isFinite);
          return values.length?Number((values.reduce((a,b)=>a+b,0)/values.length).toFixed(1)):0;
        };
        const groups=Object.entries(definitions).map(([category,fields])=>{
          const items=rows.filter(row=>row.category===category);
          if(!items.length)return '';
          return `<article class="stat-group"><h3>${live.esc(category.toUpperCase())}</h3><div class="season-grid">${fields.map(field=>`<div class="season-stat"><span>${live.esc(field[0])}</span><strong>${live.esc(calculate(items,field))}</strong></div>`).join('')}</div></article>`;
        }).filter(Boolean).join('');
        const teamName=live.cleanTeamName(team?.display_name||team?.nick_name||'Free Agent');
        document.title=`${live.playerName(p)} | AML Player`;
        root.innerHTML=`<section class="player-hero"><span class="eyebrow">LIVE MADDEN 27 PLAYER</span><div class="ovr-big">${live.esc(p.player_best_ovr)} OVR</div><h1>${live.esc(live.playerName(p))}</h1><div class="player-meta"><a class="player-team" href="${live.teamUrl(p.team_id)}">${live.esc(teamName)}</a><span>${live.esc(p.position)}</span><span>#${live.esc(p.jersey_num??'—')}</span><span>Age ${live.esc(p.age)}</span><span>${live.esc(live.formatHeight(p.height))} • ${live.esc(p.weight)} lbs</span><span>${live.esc(live.devLabel(p.dev_trait))}</span><span>${live.esc(p.college||'')}</span></div></section><div class="section-heading"><span>SEASON 14</span><h2>SEASON STATS</h2></div><section class="stat-groups">${groups||'<div class="empty-stats">No completed-game stats are available for this player yet.</div>'}</section><div class="section-heading"><span>PLAYER RATINGS</span><h2>OVERALL ATTRIBUTES</h2></div><section class="rating-grid">${ratings.map(([name,value])=>`<article class="rating"><span>${live.esc(name.toUpperCase())}</span><strong>${live.esc(value)}</strong></article>`).join('')}</section>`;
      }catch(error){console.error('AML player profile:',error);root.innerHTML='<p class="status">Could not load player data.</p>';}
    })();
  </script>
</body>
</html>
