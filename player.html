<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050507" />
  <title>AML Player | Apollo Madden League</title>
  <link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="premium.css?v=18" />
  <style>
    .data-shell{width:min(1050px,calc(100% - 24px));margin:0 auto;padding:34px 0 70px}.player-hero{padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(255,255,255,.035);margin-top:24px}.player-hero h1{font-size:clamp(2.8rem,7vw,5.5rem);line-height:.92;margin:8px 0}.player-meta{display:flex;gap:10px;flex-wrap:wrap;color:#aeb4c5;font-weight:800}.ovr-big{font-size:4rem;font-weight:950}.rating-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}.rating{padding:16px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:rgba(255,255,255,.03)}.rating span{display:block;color:#989eaf;font-size:.72rem;font-weight:800;letter-spacing:.08em}.rating strong{display:block;font-size:1.5rem;margin-top:5px}.status{margin-top:22px;color:#9fa4b3}@media(max-width:700px){.rating-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body class="aml-page"><main class="data-shell"><div class="topbar"><img class="mini-logo" src="assets/aml-logo.png" alt="AML logo"/><a class="home-link" href="rosters.html">← ROSTERS</a></div><div id="root"><p class="status">Loading player…</p></div></main>
<script src="aml-live.js?v=1"></script><script>
(async()=>{const live=window.AML_LIVE,root=document.getElementById('root'),id=Number(new URLSearchParams(location.search).get('rosterId')||0);if(!id){root.innerHTML='<p class="status">No player selected.</p>';return}try{const d=await live.api(`/player/${id}`),p=d.player;const ratings=[['Speed',p.speed_rating],['Acceleration',p.accel_rating],['Agility',p.agility_rating],['Awareness',p.aware_rating],['Strength',p.strength_rating],['Stamina',p.stamina_rating],['Throw Power',p.throw_power_rating],['Short Accuracy',p.throw_acc_short_rating],['Mid Accuracy',p.throw_acc_mid_rating],['Deep Accuracy',p.throw_acc_deep_rating],['Catch',p.catch_rating],['Carry',p.carry_rating],['Short Route',p.route_run_short_rating],['Medium Route',p.route_run_med_rating],['Deep Route',p.route_run_deep_rating],['Tackle',p.tackle_rating],['Hit Power',p.hit_power_rating],['Man Coverage',p.man_cover_rating],['Zone Coverage',p.zone_cover_rating],['Press',p.press_rating],['Block Shed',p.block_shed_rating],['Finesse Moves',p.finesse_moves_rating],['Power Moves',p.power_moves_rating],['Kick Power',p.kick_power_rating],['Kick Accuracy',p.kick_acc_rating]].filter(x=>x[1]!==null&&x[1]!==undefined);root.innerHTML=`<section class="player-hero"><span class="eyebrow">LIVE MADDEN 27 PLAYER</span><div class="ovr-big">${live.esc(p.player_best_ovr)} OVR</div><h1>${live.esc(live.playerName(p))}</h1><div class="player-meta"><span>${live.esc(p.position)}</span><span>#${live.esc(p.jersey_num ?? '—')}</span><span>Age ${live.esc(p.age)}</span><span>${live.esc(live.formatHeight(p.height))} • ${live.esc(p.weight)} lbs</span><span>${live.esc(live.devLabel(p.dev_trait))}</span><span>${live.esc(p.college||'')}</span></div></section><section class="rating-grid">${ratings.map(([n,v])=>`<article class="rating"><span>${live.esc(n.toUpperCase())}</span><strong>${live.esc(v)}</strong></article>`).join('')}</section>`}catch(e){console.error(e);root.innerHTML='<p class="status">Could not load player data.</p>'}})();
</script></body></html>
