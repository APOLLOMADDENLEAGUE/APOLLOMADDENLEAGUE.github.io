<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>AML Live Playoff Picture</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="premium.css?v=28"><style>
.shell{width:min(1180px,calc(100% - 24px));margin:auto;padding:34px 0 70px}.hero h1{font-size:clamp(3rem,8vw,6rem);line-height:.92;margin:8px 0 12px}.conferences{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}.conference{border:1px solid #ffffff18;border-radius:22px;padding:18px;background:#ffffff07}.seed{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid #ffffff12;align-items:center}.seed-num{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#ff2bbf;font-weight:950}.seed:nth-child(n+5) .seed-num{background:#20232d}.record{font-weight:900}.tag,.hunt{color:#9fa4b3;font-size:.78rem}.hunt-list{line-height:1.8}@media(max-width:700px){.conferences{grid-template-columns:1fr}}
</style></head><body class="aml-page"><main class="shell"><div class="topbar"><img class="mini-logo" src="assets/aml-logo.png" alt="AML logo"><a class="home-link" href="current-league.html">← CURRENT LEAGUE</a></div><section class="hero"><span class="eyebrow">LIVE SEASON 14 SEEDING</span><h1>PLAYOFF PICTURE</h1><p>Division leaders claim seeds 1–4. The next three teams enter as wild cards.</p></section><p class="tag" id="status">Loading current standings…</p><section class="conferences" id="root"></section></main><script src="aml-live.js?v=6"></script><script src="app.js?v=20" defer></script><script>
(async()=>{const live=window.AML_LIVE,root=document.getElementById('root'),status=document.getElementById('status');try{const d=await live.api('/standings'),all=d.standings||[];const pct=r=>{const g=Number(r.total_wins)+Number(r.total_losses)+Number(r.total_ties||0);return g?(Number(r.total_wins)+Number(r.total_ties||0)/2)/g:0},sort=(a,b)=>pct(b)-pct(a)||(Number(b.net_pts)||0)-(Number(a.net_pts)||0);function conference(name){const rows=all.filter(r=>String(r.division_name||'').startsWith(name));const groups=new Map();rows.forEach(r=>{const div=r.division_name;if(!groups.has(div))groups.set(div,[]);groups.get(div).push(r)});const champs=[...groups.values()].map(x=>x.sort(sort)[0]).sort(sort),used=new Set(champs.map(x=>x.team_id)),wild=rows.filter(x=>!used.has(x.team_id)).sort(sort).slice(0,3),seeds=[...champs,...wild],seeded=new Set(seeds.map(x=>x.team_id)),hunt=rows.filter(x=>!seeded.has(x.team_id)).sort(sort);return `<article class="conference"><span class="eyebrow">${name}</span><h2>${name} PLAYOFF TEAMS</h2>${seeds.map((r,i)=>`<div class="seed"><span class="seed-num">${i+1}</span><span><strong>${live.esc(live.cleanTeamName(r.display_name||r.team_name))}</strong><br><span class="tag">${i<4?'DIVISION LEADER':'WILD CARD'} • ${live.esc(r.division_name)}</span></span><span class="record">${live.esc(live.currentRecord(r))}</span></div>`).join('')}<h3>IN THE HUNT</h3><div class="hunt-list">${hunt.map(r=>`${live.esc(live.cleanTeamName(r.display_name||r.team_name))} — ${live.esc(live.currentRecord(r))}`).join('<br>')}</div></article>`}root.innerHTML=conference('AFC')+conference('NFC');status.textContent=`Live from the latest Madden export • ${d.count||all.length} teams`}catch(e){console.error(e);status.textContent='Playoff data is temporarily unavailable.'}})();
</script></body></html>
