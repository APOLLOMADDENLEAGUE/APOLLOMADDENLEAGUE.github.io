<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>AML League Records</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="premium.css?v=28"><style>
.record-shell{width:min(1180px,calc(100% - 24px));margin:auto;padding:34px 0 70px}.record-hero h1{font-size:clamp(3rem,8vw,6rem);margin:8px 0 12px;line-height:.92}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.tabs button{border:1px solid #ffffff20;background:#11131a;color:#fff;border-radius:999px;padding:11px 16px;font-weight:900}.tabs button.active{background:#fff;color:#07080c}.records-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.record-card{padding:18px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff08}.record-card small{color:#ff63b7;font-weight:900;letter-spacing:.08em}.record-card h2{margin:8px 0 4px}.record-value{font-size:2rem;font-weight:950}.muted{color:#9fa4b3}.loading{padding:24px;border:1px solid #ffffff18;border-radius:18px}@media(max-width:680px){.records-grid{grid-template-columns:1fr}}
</style></head><body class="aml-page"><main class="record-shell"><div class="topbar"><img class="mini-logo" src="assets/aml-logo.png" alt="AML logo"><a class="home-link" href="current-league.html">← CURRENT LEAGUE</a></div><section class="record-hero"><span class="eyebrow">TRACKING BEGAN IN SEASON 14</span><h1>LEAGUE RECORDS</h1><p>AML single-game, season and career records calculated from official Madden exports.</p></section><div class="tabs" id="tabs"><button class="active" data-type="game">SINGLE GAME</button><button data-type="season">SEASON RECORDS</button><button data-type="career">CAREER RECORDS</button></div><p class="muted" id="status">Loading official records…</p><section class="records-grid" id="grid"><div class="loading">Calculating records…</div></section></main><script src="aml-live.js?v=6"></script><script src="app.js?v=20" defer></script><script>
(async()=>{const live=window.AML_LIVE,grid=document.getElementById('grid'),status=document.getElementById('status');
const defs=[['passing','passYds','PASSING YARDS','YDS'],['passing','passTDs','PASSING TOUCHDOWNS','TD'],['rushing','rushYds','RUSHING YARDS','YDS'],['rushing','rushTDs','RUSHING TOUCHDOWNS','TD'],['receiving','recCatches','RECEPTIONS','REC'],['receiving','recYds','RECEIVING YARDS','YDS'],['receiving','recTDs','RECEIVING TOUCHDOWNS','TD'],['defense','defTotalTackles','TACKLES','TKL'],['defense','defSacks','SACKS','SACK'],['defense','defInts','DEFENSIVE INTERCEPTIONS','INT'],['defense','defTDs','DEFENSIVE TOUCHDOWNS','TD'],['kicking','kickPts','KICKING POINTS','PTS'],['kicking','fGLongest','LONGEST FIELD GOAL','YDS'],['team','offTotalYds','TEAM TOTAL OFFENSE','YDS'],['team','offPtsPerGame','TEAM POINTS','PTS']];let exports=[],teams=new Map(),type='game';
try{const [w,t]=await Promise.all([live.api('/weekly'),live.api('/teams')]);exports=(w.exports||[]).filter(e=>e.success&&Array.isArray(e.items)).flatMap(e=>e.items.map(r=>({...r,category:e.category})));(t.teams||[]).forEach(x=>teams.set(Number(x.team_id),live.cleanTeamName(x.display_name||x.nick_name)));status.textContent='Official AML records • Tracking began in Season 14';render()}catch(e){console.error(e);status.textContent='Records are temporarily unavailable.';grid.innerHTML='<div class="loading">Could not load record data.</div>'}
function seasonOf(r){return 14+(Number(r.seasonIndex)||0)}function identity(r){return r.category==='team'?`team-${r.teamId}`:`player-${r.rosterId||r.fullName}`}
function candidates(category,key){const rows=[...new Map(exports.filter(r=>r.category===category).map((r,i)=>[r.statId||`${r.scheduleId}-${identity(r)}-${i}`,r])).values()];if(type==='game')return rows;if(type==='season'){const m=new Map();rows.forEach(r=>{const id=`${seasonOf(r)}-${identity(r)}`,x=m.get(id)||{...r,[key]:0,_season:seasonOf(r)};x[key]+=Number(r[key])||0;m.set(id,x)});return [...m.values()]};const m=new Map();rows.forEach(r=>{const id=identity(r),x=m.get(id)||{...r,[key]:0};x[key]+=Number(r[key])||0;m.set(id,x)});return [...m.values()]}
function render(){grid.innerHTML=defs.map(([category,key,label,unit])=>{const r=candidates(category,key).sort((a,b)=>(Number(b[key])||0)-(Number(a[key])||0))[0];if(!r)return'';const name=category==='team'?(teams.get(Number(r.teamId))||r.teamName||'Unknown Team'):r.fullName;const team=teams.get(Number(r.teamId))||r.teamName||'Unknown Team';const meta=type==='game'?`${team} • Season ${seasonOf(r)} • Week ${(Number(r.weekIndex)||0)+1}`:type==='season'?`${team} • Season ${r._season}`:`${team} • Since Season 14`;return `<article class="record-card"><small>${label}</small><div class="record-value">${live.esc(r[key]||0)} ${unit}</div><h2>${live.esc(name)}</h2><div class="muted">${live.esc(meta)}</div></article>`}).join('')}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;render()})})();
</script></body></html>
