<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050507" />
  <title>AML Rivalries | Apollo Madden League</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="premium.css?v=19" />
  <style>
    :root{--rival-red:#ff315a;--rival-blue:#3da8ff}
    .rivalries-shell{width:min(1240px,calc(100% - 28px));margin:0 auto;padding:30px 0 78px}
    .rivalries-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:40px}
    .rivalries-top img{width:108px;display:block}.rivalries-top a{font-size:.8rem;font-weight:900;letter-spacing:.13em}
    .rivalries-hero{position:relative;padding:28px 0 34px}
    .rivalries-hero:after{content:"";display:block;width:100%;height:1px;margin-top:30px;background:linear-gradient(90deg,var(--rival-red),rgba(255,255,255,.1),var(--rival-blue))}
    .rivalries-hero h1{margin:8px 0 12px;font-size:clamp(3.6rem,10vw,8.5rem);line-height:.82;letter-spacing:-.06em}
    .rivalries-hero p{max-width:740px;margin:0;color:#b8bac5;line-height:1.7;font-size:1.03rem}
    .rivalries-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .rivalries-meta span{padding:8px 12px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.04);font-size:.7rem;font-weight:900;letter-spacing:.1em}
    .rivalry-status{min-height:24px;margin:22px 0 14px;color:#aeb1bd;font-size:.78rem;font-weight:800;letter-spacing:.08em}
    .rivalries-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .rivalry-card{position:relative;overflow:hidden;padding:23px 20px 20px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:linear-gradient(145deg,rgba(18,18,25,.96),rgba(7,8,13,.96));box-shadow:0 18px 55px rgba(0,0,0,.28)}
    .rivalry-card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,color-mix(in srgb,var(--left) 13%,transparent),transparent 43%,transparent 58%,color-mix(in srgb,var(--right) 13%,transparent));pointer-events:none}
    .rivalry-number{position:absolute;top:16px;left:18px;color:rgba(255,255,255,.24);font-size:.68rem;font-weight:900;letter-spacing:.14em}
    .matchup{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);align-items:center;gap:6px}
    .team-side{min-width:0;text-align:center;text-decoration:none;color:#fff}
    .helmet-stage{position:relative;width:min(100%,210px);aspect-ratio:1.2;margin:0 auto 4px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.45));transition:transform .22s ease}
    .team-side:hover .helmet-stage{transform:translateY(-5px) scale(1.025)}
    .helmet-color{position:absolute;inset:0;background:var(--helmet-color);-webkit-mask:url('assets/rivalry-helmet.webp') center/contain no-repeat;mask:url('assets/rivalry-helmet.webp') center/contain no-repeat;filter:saturate(1.18) brightness(1.08)}
    .helmet{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.46;mix-blend-mode:luminosity}
    .team-side.left .helmet-color,.team-side.left .helmet{transform:scaleX(-1)}
    .helmet-logo{position:absolute;z-index:3;top:21%;left:50%;width:50%;height:50%;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 4px 3px rgba(0,0,0,.92)) drop-shadow(0 0 4px rgba(255,255,255,.3))}
    .team-name{display:block;min-height:2.3em;font-size:clamp(.92rem,2vw,1.25rem);font-weight:950;line-height:1.04;letter-spacing:-.02em;text-transform:uppercase}
    .vs{display:grid;place-items:center;width:48px;height:48px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:#0a0b10;box-shadow:0 0 0 5px rgba(255,255,255,.035);font-size:.82rem;font-weight:1000;font-style:italic;letter-spacing:.03em}
    .series{position:relative;margin-top:17px;padding-top:15px;border-top:1px solid rgba(255,255,255,.09);text-align:center}
    .series-label{display:block;margin-bottom:5px;color:#8e919e;font-size:.62rem;font-weight:900;letter-spacing:.16em}
    .series-record{display:block;font-size:1.15rem;font-weight:1000;letter-spacing:.015em}
    .series-detail{display:block;min-height:1.2em;margin-top:5px;color:#9497a3;font-size:.69rem;font-weight:700}
    @media(max-width:820px){.rivalries-grid{grid-template-columns:1fr}.rivalry-card{padding-inline:14px}}
    @media(max-width:480px){.rivalries-shell{width:min(100% - 18px,1240px)}.rivalries-top img{width:86px}.rivalries-hero h1{font-size:3.2rem}.matchup{grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr)}.vs{width:38px;height:38px}.team-name{font-size:.9rem}}
  </style>
</head>
<body class="aml-page">
  <div class="background-glow glow-pink"></div><div class="background-glow glow-blue"></div>
  <main class="rivalries-shell">
    <div class="rivalries-top"><img src="assets/aml-logo.png" alt="AML logo" /><a href="index.html">← AML HOME</a></div>
    <section class="rivalries-hero">
      <span class="eyebrow">BAD BLOOD • BIG GAMES</span>
      <h1>AML RIVALRIES</h1>
      <p>Sixteen matchups. Thirty-two franchises. Every completed Season 14 rivalry game updates the series automatically from the official AML schedule.</p>
      <div class="rivalries-meta"><span>16 RIVALRIES</span><span>SEASON 14 SERIES</span><span>LIVE RECORDS</span></div>
    </section>
    <div class="rivalry-status" id="rivalry-status" role="status">LOADING OFFICIAL SERIES RECORDS…</div>
    <section class="rivalries-grid" id="rivalries-grid" aria-label="AML rivalries"></section>
  </main>
  <script>
    const API_BASE='https://nphetjaaobftmpeqyfwa.supabase.co/functions/v1/aml-public-data';
    const H='assets/rivalry-helmet.webp';
    const rivalries=[
      [{id:777781250,name:'Mob',page:'team-mob.html',logo:'assets/mob.png',color:'#b8202e'},{id:777781279,name:'Surfers',page:'team-surfers.html',logo:'assets/surfers.png',color:'#1f9898'}],
      [{id:777781276,name:'Ducks',page:'team-ducks.html',logo:'assets/ducks.png',color:'#f2bf2f'},{id:777781253,name:'Black Cats',page:'team-black-cats.html',logo:'assets/black-cats.png',color:'#b8f13b'}],
      [{id:777781260,name:'Speed Racers',page:'team-speed-racers.html',logo:'assets/speed-racers.png',color:'#d7292f'},{id:777781280,name:'Apollo',page:'team-apollo.html',logo:'assets/apollo.png',color:'#d6a548'}],
      [{id:777781281,name:'Stingers',page:'team-stingers.html',logo:'assets/stingers-hornet-v34.png',color:'#fff200'},{id:777781268,name:'Volts',page:'team-volts.html',logo:'assets/volts.png',color:'#72b7e9'}],
      [{id:777781251,name:'Blizzards',page:'team-blizzards.html',logo:'assets/blizzards.png',color:'#65c7ff'},{id:777781269,name:'Overdrive',page:'team-overdrive.html',logo:'assets/overdrive.png',color:'#1d72ff'}],
      [{id:777781263,name:'Sorcerers',page:'team-sorcerers.html',logo:'assets/sorcerers.png',color:'#57e2ff'},{id:777781273,name:'Order',page:'team-order.html',logo:'assets/order.png',color:'#b3882b'}],
      [{id:777781252,name:'Guardians',page:'team-guardians.html',logo:'assets/guardians.png',color:'#c89a3b'},{id:777781259,name:'Sharks',page:'team-sharks.html',logo:'assets/sharks.png',color:'#16999f'}],
      [{id:777781274,name:'Lake Hawks',page:'team-lake-hawks.html',logo:'assets/lake-hawks.png',color:'#2b8aa7'},{id:777781258,name:'Thunder Birds',page:'team-thunder-birds.html',logo:'assets/thunder-birds.png',color:'#315ed1'}],
      [{id:777781249,name:'Road Runners',page:'team-rhode-runners.html',logo:'assets/rhode-runners.png',color:'#7844aa'},{id:777781282,name:'Dragons',page:'team-dragons.html',logo:'assets/dragons.png',color:'#13b9b5'}],
      [{id:777781271,name:'Empire',page:'team-empire.html',logo:'assets/empire.png',color:'#4da2ff'},{id:777781270,name:'Stars',page:'team-stars.html',logo:'assets/stars.png',color:'#50c8ff'}],
      [{id:777781254,name:'Flamingos',page:'team-flamingos.html',logo:'assets/flamingos.png',color:'#ff6ea8'},{id:777781272,name:'Omnitrix',page:'team-omnitrix.html',logo:'assets/omnitrix.png',color:'#9dff45'}],
      [{id:777781277,name:'Voodoo',page:'team-vodoo.html',logo:'assets/vodoo.png',color:'#cfaa4e'},{id:777781265,name:'Falcons',page:'team-falcons.html',logo:'assets/falcons.png',color:'#ed2438'}],
      [{id:777781267,name:'K9',page:'team-kloud-nine.html',logo:'assets/kloud-nine.png',color:'#d9e5ff'},{id:777781262,name:'Phoenix',page:'team-pheonixes.html',logo:'assets/pheonixes.png',color:'#e12a2e'}],
      [{id:777781264,name:'Kush',page:'team-kush.html',logo:'assets/kush.png',color:'#75c744'},{id:777781261,name:'Supermen',page:'team-supermen.html',logo:'assets/supermen.png',color:'#d54444'}],
      [{id:777781278,name:'Griffins',page:'team-griffins.html',logo:'assets/griffins.png',color:'#e3b33d'},{id:777781255,name:'Metros',page:'team-metros.html',logo:'assets/metros.png',color:'#e52a38'}],
      [{id:777781248,name:'Ocelots',page:'team-ocelots.html',logo:'assets/ocelots.png',color:'#d4a567'},{id:777781275,name:'Minions',page:'team-minions.html',logo:'assets/minions.png',color:'#f2c62f'}]
    ];
    const grid=document.getElementById('rivalries-grid');
    const statusEl=document.getElementById('rivalry-status');
    const teamSide=(team,side)=>`<a class="team-side ${side}" style="--helmet-color:${team.color}" href="${team.page}" aria-label="Open ${team.name} team page"><div class="helmet-stage"><span class="helmet-color" aria-hidden="true"></span><img class="helmet" src="${H}" alt="" aria-hidden="true"><img class="helmet-logo" src="${team.logo}" alt="${team.name} logo"></div><span class="team-name">${team.name}</span></a>`;
    function render(games=[]){
      const finals=games.filter(g=>Number(g.stage_index)===1&&Number(g.status)>1);
      grid.innerHTML=rivalries.map(([a,b],i)=>{
        const meetings=finals.filter(g=>{const h=Number(g.home_team_id),v=Number(g.away_team_id);return(h===a.id&&v===b.id)||(h===b.id&&v===a.id)});
        let aw=0,bw=0,ties=0;
        meetings.forEach(g=>{const hs=Number(g.home_score),as=Number(g.away_score),home=Number(g.home_team_id);if(hs===as)ties++;else{const winner=hs>as?home:Number(g.away_team_id);if(winner===a.id)aw++;else if(winner===b.id)bw++}});
        const detail=meetings.length?`${meetings.length} GAME${meetings.length===1?'':'S'} PLAYED${ties?' • '+ties+' TIE'+(ties===1?'':'S'):''}`:'NO MEETINGS YET';
        return `<article class="rivalry-card" style="--left:${a.color};--right:${b.color}"><span class="rivalry-number">RIVALRY ${String(i+1).padStart(2,'0')}</span><div class="matchup">${teamSide(a,'left')}<span class="vs">VS</span>${teamSide(b,'right')}</div><div class="series"><span class="series-label">SEASON 14 SERIES</span><span class="series-record">${a.name} ${aw}–${bw} ${b.name}</span><span class="series-detail">${detail}</span></div></article>`;
      }).join('');
    }
    render();
    fetch(API_BASE+'/schedule')
      .then(r=>{if(!r.ok)throw new Error('Schedule unavailable');return r.json()})
      .then(data=>{const games=Array.isArray(data)?data:(data.games||data.schedule||[]);render(games);statusEl.textContent='OFFICIAL SEASON 14 RECORDS • UPDATED FROM COMPLETED GAMES';})
      .catch(()=>{statusEl.textContent='LIVE RECORDS ARE TEMPORARILY UNAVAILABLE • TRY AGAIN SHORTLY';});
  </script>
  <script src="app.js?v=18" defer></script>
</body>
</html>
