<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050507" />
  <title>AML Rosters | Apollo Madden League</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="premium.css?v=18" />
  <style>
    .data-shell{width:min(1240px,calc(100% - 24px));margin:0 auto;padding:34px 0 70px}.data-hero h1{font-size:clamp(3rem,8vw,6rem);margin:8px 0 12px;line-height:.92}.data-tools{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}.data-tools select,.data-tools input{background:#11131a;border:1px solid rgba(255,255,255,.12);color:#fff;padding:12px 14px;border-radius:12px}.roster-list{display:grid;gap:10px}.player-row{display:grid;grid-template-columns:70px 1.5fr 90px 90px 110px 1fr;gap:12px;align-items:center;padding:15px 17px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:rgba(255,255,255,.035);color:#fff;text-decoration:none}.ovr{font-size:1.35rem;font-weight:950}.pos,.dev,.team{color:#aeb4c5;font-size:.86rem;font-weight:800}.player-name{font-weight:900}.empty{padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:16px}.status{color:#9fa4b3;margin-bottom:18px}@media(max-width:760px){.player-row{grid-template-columns:55px 1fr 62px}.dev,.team,.age{display:none}}
  </style>
</head>
<body class="aml-page">
  <main class="data-shell">
    <div class="topbar"><img class="mini-logo" src="assets/aml-logo.png" alt="AML logo"/><a class="home-link" href="current-league.html">← CURRENT LEAGUE</a></div>
    <section class="data-hero"><span class="eyebrow">LIVE MADDEN 27 DATA</span><h1>ROSTERS</h1><p>Browse every AML player, overall rating, development trait and team directly from the latest Companion export.</p></section>
    <div class="data-tools"><select id="team-filter"><option value="">All Teams</option></select><select id="position-filter"><option value="">All Positions</option></select><input id="search" placeholder="Search player" /></div>
    <p class="status" id="status">Loading live roster…</p>
    <section class="roster-list" id="roster-list"></section>
  </main>
  <script src="aml-live.js?v=1"></script>
  <script>
    (async()=>{
      const live=window.AML_LIVE, list=document.getElementById('roster-list'), status=document.getElementById('status');
      const teamSelect=document.getElementById('team-filter'), posSelect=document.getElementById('position-filter'), search=document.getElementById('search');
      const params=new URLSearchParams(location.search); const initialTeam=params.get('teamId')||'';
      let players=[],teams=[];
      try{
        const [t,r]=await Promise.all([live.api('/teams'),live.api(initialTeam?`/roster?teamId=${encodeURIComponent(initialTeam)}&limit=500`:'/players?limit=500')]);
        teams=t.teams||[]; players=r.players||[];
        teams.sort((a,b)=>live.cleanTeamName(a.display_name).localeCompare(live.cleanTeamName(b.display_name))).forEach(team=>{const o=document.createElement('option');o.value=team.team_id;o.textContent=live.cleanTeamName(team.display_name);teamSelect.appendChild(o)});
        if(initialTeam) teamSelect.value=initialTeam;
        [...new Set(players.map(p=>p.position).filter(Boolean))].sort().forEach(pos=>{const o=document.createElement('option');o.value=pos;o.textContent=pos;posSelect.appendChild(o)});
        render();
      }catch(e){console.error(e);status.textContent='Live roster data is unavailable.';list.innerHTML='<div class="empty">Could not load roster data.</div>'}

      async function reloadTeam(){
        const id=teamSelect.value; status.textContent='Loading…';
        try{const r=await live.api(id?`/roster?teamId=${encodeURIComponent(id)}&limit=500`:'/players?limit=500');players=r.players||[];render()}catch(e){console.error(e);status.textContent='Could not load roster.'}
      }
      function render(){
        const q=search.value.trim().toLowerCase(),pos=posSelect.value;
        const filtered=players.filter(p=>(!pos||p.position===pos)&&(!q||live.playerName(p).toLowerCase().includes(q)));
        status.textContent=`${filtered.length} players shown`;
        list.innerHTML=filtered.length?filtered.map(p=>`<a class="player-row" href="${live.playerUrl(p.roster_id)}"><strong class="ovr">${live.esc(p.player_best_ovr)}</strong><span class="player-name">${live.esc(live.playerName(p))}</span><span class="pos">${live.esc(p.position)}</span><span class="age">Age ${live.esc(p.age)}</span><span class="dev">${live.esc(live.devLabel(p.dev_trait))}</span><span class="team">${live.esc(live.cleanTeamName(p.team_name||p.team_nickname||''))}</span></a>`).join(''):'<div class="empty">No players match those filters.</div>';
      }
      teamSelect.addEventListener('change',reloadTeam);posSelect.addEventListener('change',render);search.addEventListener('input',render);
    })();
  </script>
</body>
</html>
