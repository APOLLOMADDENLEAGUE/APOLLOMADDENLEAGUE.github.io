<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" /><meta name="theme-color" content="#050507" />
  <title>AML Schedule & Scores | Apollo Madden League</title><link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="premium.css?v=18" />
  <style>.data-shell{width:min(1120px,calc(100% - 24px));margin:0 auto;padding:34px 0 70px}.data-hero h1{font-size:clamp(3rem,8vw,6rem);margin:8px 0 12px;line-height:.92}.status{color:#9fa4b3;margin:20px 0}.week-nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}.week-button{flex:0 0 auto;border:1px solid rgba(255,255,255,.12);background:#11131a;color:#fff;border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer}.week-button:hover,.week-button:focus-visible{border-color:rgba(255,99,183,.65)}.week-button.active{background:#fff;color:#07080c}.week-block{margin:20px 0}.week-title{font-size:1.35rem;margin-bottom:12px}.games{display:grid;gap:10px}.game{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:rgba(255,255,255,.035);color:#fff;text-decoration:none}.game[href]{cursor:pointer;transition:border-color .18s ease,background .18s ease,transform .18s ease}.game[href]:hover,.game[href]:focus-visible{border-color:rgba(255,99,183,.65);background:rgba(255,255,255,.065);transform:translateY(-1px)}.team-side:last-child{text-align:right}.team-name{font-weight:900}.score{font-size:1.5rem;font-weight:950;white-space:nowrap}.meta{font-size:.78rem;color:#aeb4c5;margin-top:4px}.box-score-note{color:#ff63b7}.empty{padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:16px}@media(max-width:650px){.game{grid-template-columns:1fr auto 1fr;gap:8px;padding:14px}.score{font-size:1.15rem}}</style>
</head>
<body class="aml-page"><main class="data-shell"><div class="topbar"><img class="mini-logo" src="assets/aml-logo.png" alt="AML logo" /><a class="home-link" href="current-league.html">← CURRENT LEAGUE</a></div><section class="data-hero"><span class="eyebrow">SEASON 14 • LIVE MADDEN 27 DATA</span><h1 id="page-title">SCHEDULE &amp; SCORES</h1><p id="page-copy">Choose a week to view its matchups and final scores.</p></section><p class="status" id="status">Loading schedule…</p><nav class="week-nav" id="week-nav" aria-label="Select schedule week"></nav><div id="schedule"></div></main><script src="aml-live.js?v=5"></script><script>
(async()=>{
  const live=window.AML_LIVE,root=document.getElementById('schedule'),status=document.getElementById('status'),nav=document.getElementById('week-nav');
  const params=new URLSearchParams(location.search),teamId=Number(params.get('teamId')||0),requestedWeek=Number(params.get('week'));
  let games=[],weeks=[],activeWeek=0,teamName='';
  try{
    const [scheduleData,teamsData]=await Promise.all([live.api('/schedule'),live.api('/teams')]);
    games=scheduleData.games||[];
    if(teamId){
      const team=(teamsData.teams||[]).find(item=>Number(item.team_id)===teamId);
      teamName=live.cleanTeamName(team?.display_name||team?.nick_name||'TEAM');
      games=games.filter(game=>Number(game.home_team_id)===teamId||Number(game.away_team_id)===teamId);
      document.getElementById('page-title').textContent=`${teamName.toUpperCase()} SCHEDULE`;
      document.getElementById('page-copy').textContent=`Season 14 schedule and results for ${teamName}.`;
      document.title=`${teamName} Schedule | Apollo Madden League`;
    }
    weeks=[...new Set(games.map(game=>Number(game.week_index)||0))].sort((a,b)=>a-b);
    activeWeek=weeks.includes(requestedWeek)?requestedWeek:(weeks[0]??0);
    nav.innerHTML=weeks.map(week=>`<button class="week-button${week===activeWeek?' active':''}" type="button" data-week="${week}">${live.weekLabel(week)}</button>`).join('');
    nav.querySelectorAll('[data-week]').forEach(button=>button.addEventListener('click',()=>{activeWeek=Number(button.dataset.week);nav.querySelectorAll('.week-button').forEach(item=>item.classList.toggle('active',item===button));const next=new URLSearchParams(location.search);next.set('week',String(activeWeek));history.replaceState(null,'',`${location.pathname}?${next}`);render();}));
    render();
  }catch(error){console.error(error);status.textContent='Live schedule is unavailable.';root.innerHTML='<div class="empty">Could not load schedule.</div>';}
  function render(){
    const weekGames=games.filter(game=>(Number(game.week_index)||0)===activeWeek);
    status.textContent=`${live.weekLabel(activeWeek)} • ${weekGames.length} ${teamId?'game':'games'}${teamName?` • ${teamName}`:''}`;
    root.innerHTML=`<section class="week-block"><h2 class="week-title">${live.weekLabel(activeWeek)}</h2><div class="games">${weekGames.map(game=>{const played=Number(game.status)>0||Number(game.away_score)>0||Number(game.home_score)>0;const tag=played?'a':'article';const href=played?` href="${live.gameUrl(game.schedule_id)}"`:'';return `<${tag} class="game"${href}><div class="team-side"><div class="team-name">${live.esc(live.cleanTeamName(game.away_team_name||game.away_abbr))}</div><div class="meta">AWAY</div></div><div class="score">${played?`${live.esc(game.away_score)} - ${live.esc(game.home_score)}`:'VS'}${played?'<div class="meta box-score-note">VIEW BOX SCORE</div>':''}</div><div class="team-side"><div class="team-name">${live.esc(live.cleanTeamName(game.home_team_name||game.home_abbr))}</div><div class="meta">HOME</div></div></${tag}>`;}).join('')}</div></section>`;
    if(!weekGames.length)root.innerHTML='<div class="empty">No game found for this week.</div>';
  }
})();
</script></body></html>
