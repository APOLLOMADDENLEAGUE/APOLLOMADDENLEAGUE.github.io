<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050507" />
  <title>Season by Season | Apollo Madden League</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .seasons-shell {
      width: min(1100px, calc(100% - 30px));
      margin: 0 auto;
      padding: 34px 0 70px;
    }
    .seasons-top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:40px;
    }
    .seasons-top img { width:110px; }
    .seasons-top a {
      color:#fff;
      text-decoration:none;
      font-size:.82rem;
      font-weight:800;
      letter-spacing:.1em;
    }
    .seasons-title {
      font-size:clamp(3rem,8vw,6rem);
      line-height:.9;
      margin:0;
      letter-spacing:-.045em;
    }
    .seasons-sub {
      color:#a7a8b2;
      margin:16px 0 32px;
    }
    .season-grid {
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:14px;
    }
    .season-tile {
      min-height:135px;
      padding:22px;
      display:flex;
      align-items:flex-end;
      text-decoration:none;
      color:#fff;
      border-radius:18px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.01)),
        rgba(17,17,23,.9);
      border:1px solid rgba(255,255,255,.09);
      font-size:1.5rem;
      font-weight:900;
      transition:transform .2s ease,border-color .2s ease;
    }
    .season-tile:hover {
      transform:translateY(-4px);
      border-color:rgba(255,255,255,.2);
    }
    @media (max-width:800px) {
      .season-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
  </style>
  <link rel="stylesheet" href="premium.css?v=12" />
</head>
<body class="seasons-page aml-page">
  <div class="background-glow glow-pink"></div>
  <div class="background-glow glow-blue"></div>
  <main class="seasons-shell">
    <div class="seasons-top">
      <img src="assets/aml-logo.png" alt="AML logo" />
      <a href="history.html">← AML HISTORY</a>
    </div>
    <h1 class="seasons-title">SEASON BY SEASON</h1>
    <p class="seasons-sub">Choose a season to enter its AML archive.</p>
    <section class="season-grid">
      <a class="season-tile" href="season-1.html">SEASON 1</a>
      <a class="season-tile" href="season-2.html">SEASON 2</a>
      <a class="season-tile" href="season-3.html">SEASON 3</a>
      <a class="season-tile" href="season-4.html">SEASON 4</a>
      <a class="season-tile" href="season-5.html">SEASON 5</a>
      <a class="season-tile" href="season-6.html">SEASON 6</a>
      <a class="season-tile" href="season-7.html">SEASON 7</a>
      <a class="season-tile" href="season-8.html">SEASON 8</a>
      <a class="season-tile" href="season-9.html">SEASON 9</a>
      <a class="season-tile" href="season-10.html">SEASON 10</a>
      <a class="season-tile" href="season-11.html">SEASON 11</a>
      <a class="season-tile" href="season-12.html">SEASON 12</a>
      <a class="season-tile" href="season-13.html">SEASON 13</a>
      <a class="season-tile" href="season-14.html">SEASON 14</a>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
