<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050507" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="premium.css?v=28" />
  <title>AML Standings | Apollo Madden League</title>
  <style>
    .live-note{margin:14px 0 26px;color:#9fa4b3}.standing-row{display:grid!important;grid-template-columns:1fr auto auto;gap:12px;align-items:center}.standing-record{font-weight:900}.standing-meta{font-size:.76rem;color:#9fa4b3}.standing-card h2{margin-bottom:14px}.loading-card{grid-column:1/-1;padding:26px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(255,255,255,.03)}
  </style>
</head>
<body class="standings-page aml-page">
  <main class="league-sub-shell">
    <div class="topbar"><img class="mini-logo" src="assets/aml-logo.png" alt="AML logo"/><a class="home-link" href="current-league.html">← CURRENT LEAGUE</a></div>
    <section class="league-sub-hero"><span class="eyebrow">LIVE FROM MADDEN 27</span><h1>STANDINGS</h1><p>Season 14 standings pulled directly from the Madden Companion export.</p></section>
    <p class="live-note" id="standings-status">Loading live standings…</p>
    <section class="standings-grid" id="standings-grid"><div class="loading-card">Connecting to AML live data…</div></section>
  </main>
  <script src="aml-live.js?v=1"></script>
  <script>
    (async()=>{
      const grid=document.getElementById('standings-grid');
      const status=document.getElementById('standings-status');
      const live=window.AML_LIVE;
      try{
        const data=await live.api('/standings');
        const groups=new Map();
        data.standings.forEach(s=>{
          const div=s.division_name||'Unknown';
          if(!groups.has(div)) groups.set(div,[]);
          groups.get(div).push(s);
        });
        const order=['AFC North','AFC South','AFC East','AFC West','NFC North','NFC South','NFC East','NFC West'];
        grid.innerHTML='';
        order.forEach(div=>{
          const rows=(groups.get(div)||[]).sort((a,b)=>(b.total_wins-a.total_wins)||(a.total_losses-b.total_losses)||(b.net_pts-a.net_pts));
          const card=document.createElement('article');
          card.className='standing-card';
          card.innerHTML=`<span class="eyebrow">${live.esc(div.split(' ')[0])}</span><h2>${live.esc(div.toUpperCase())}</h2><div class="standing-list">${rows.map((s,i)=>`<div class="standing-row"><span class="standing-team">${i+1}. ${live.esc(live.cleanTeamName(s.display_name||s.team_name))}</span><span class="standing-meta">${live.esc(s.user_name||'CPU')}</span><strong class="standing-record">${live.esc(live.currentRecord(s))}</strong></div>`).join('')}</div>`;
          grid.appendChild(card);
        });
        const week=Math.max(...data.standings.map(s=>Number(s.week_index)||0));
        status.textContent=`Live Season 14 data • ${data.count} teams • Week ${week+1} state from latest export`;
      }catch(e){
        console.error(e); status.textContent='Live standings are temporarily unavailable.'; grid.innerHTML='<div class="loading-card">Could not load live standings.</div>';
      }
    })();
  </script>
</body>
</html>
