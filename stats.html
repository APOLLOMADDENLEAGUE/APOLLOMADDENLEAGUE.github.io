<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#050507"/><title>AML Stats | Apollo Madden League</title><link rel="stylesheet" href="styles.css"/><link rel="stylesheet" href="premium.css?v=18"/><style>.data-shell{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:34px 0 70px}.data-hero h1{font-size:clamp(3rem,8vw,6rem);margin:8px 0 12px;line-height:.92}.cats{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.cats button{border:1px solid rgba(255,255,255,.12);background:#11131a;color:#fff;border-radius:999px;padding:10px 14px;font-weight:850;cursor:pointer}.cats button.active{background:#fff;color:#07080c}.status{color:#9fa4b3;margin:18px 0}.stat-table{overflow:auto;border:1px solid rgba(255,255,255,.09);border-radius:18px}.stat-table table{width:100%;border-collapse:collapse;min-width:720px}.stat-table th,.stat-table td{text-align:left;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07)}.stat-table th{font-size:.72rem;letter-spacing:.08em;color:#9fa4b3}.empty{padding:24px}</style></head>
<body class="aml-page"><main class="data-shell"><div class="topbar"><img class="mini-logo" src="assets/aml-logo.png" alt="AML logo"/><a class="home-link" href="current-league.html">← CURRENT LEAGUE</a></div><section class="data-hero"><span class="eyebrow">LIVE MADDEN 27 DATA</span><h1>WEEKLY STATS</h1><p>Passing, rushing, receiving, defense, kicking and team stat exports. This page fills automatically when Madden has weekly stats available.</p></section><div class="cats" id="cats"></div><p class="status" id="status">Loading stat exports…</p><div class="stat-table" id="table"></div></main><script src="aml-live.js?v=1"></script><script>
(async()=>{const live=window.AML_LIVE,cats=document.getElementById('cats'),status=document.getElementById('status'),table=document.getElementById('table');let exports=[];try{const d=await live.api('/weekly');exports=d.exports||[];const categories=[...new Set(exports.map(x=>x.category))];categories.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.toUpperCase();b.className=i===0?'active':'';b.onclick=()=>{[...cats.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');render(c)};cats.appendChild(b)});if(categories.length)render(categories[0]);else{status.textContent='No weekly stat exports yet.';table.innerHTML='<div class="empty">Stats will appear after the first completed week export.</div>'}}catch(e){console.error(e);status.textContent='Stats are temporarily unavailable.';table.innerHTML='<div class="empty">Could not load weekly stats.</div>'}
function render(cat){const x=exports.find(e=>e.category===cat);if(!x){return}if(!x.success||!Array.isArray(x.items)||!x.items.length){status.textContent=`${cat.toUpperCase()} • ${x.message||'No stats available for this week yet.'}`;table.innerHTML='<div class="empty">No player rows yet. Madden will populate this automatically after games are played and the weekly export succeeds.</div>';return}const rows=x.items;const preferred=['fullName','playerName','firstName','lastName','teamName','teamId','passYds','passTDs','rushYds','rushTDs','recYds','recTDs','receptions','sacks','defInts','soloTackles','fGMade','fGAtt'];let keys=preferred.filter(k=>k in rows[0]);if(keys.length<3)keys=Object.keys(rows[0]).filter(k=>['string','number','boolean'].includes(typeof rows[0][k])).slice(0,10);status.textContent=`${cat.toUpperCase()} • Week ${(Number(x.week_index)||0)+1} • ${rows.length} rows`;table.innerHTML=`<table><thead><tr>${keys.map(k=>`<th>${live.esc(k.replace(/([A-Z])/g,' $1').toUpperCase())}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${live.esc(r[k]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}}
})();</script></body></html>
